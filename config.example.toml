# fp-l-tether 設定ファイルテンプレ
# このファイルを config.toml にコピーして編集してください
# config.toml は .gitignore 対象です

[camera]
# カメラの識別。複数台接続時に区別したい場合のみ設定
# (空文字なら最初に見つかった Sigma fp/fp L を使用)
serial_number = ""

# シャッター検知ポーリング間隔 (ms)
# 撮影中は idle_ms を無視して active_ms で短く回す
poll_idle_ms = 200
poll_active_ms = 100

# GetBigPartialPictFile の1チャンクサイズ (bytes)
# 大きいほど速いが、転送途中のエラーで全体再取得になる
chunk_size = 1048576  # 1 MiB

# 撮影後のクリーンアップ (ClearImageDBSingle) を実行するか
# true 推奨: カメラ内 ImageDB が溢れて撮影できなくなるのを防ぐ
clear_image_db_after_download = true

# USB keep-alive heartbeat
# fp L は約5分のバス idle で内部省電力モードに入り、vendor get-*
# が 0-byte data phase を返すようになる。1分毎に benign な ping
# (sigma_get_camera_info) を打つことで予防。
# true 推奨。本体メニュー System → Auto Power Off → OFF も併せて。
keep_alive_enabled = true
keep_alive_interval_s = 60.0

# Burst-aware post-capture quiet window. After a burst settles
# (snap queue drains) the daemon enforces a no-PTP-traffic window of:
#   commit_window_base_s + commit_window_per_shot_s * (burst - 1)
# where burst = number of contiguous shots since the previous
# quiet window. Prevents Errno 60 wedge after long bursts
# (10-shot burst → ~14 s with defaults; 13 s observed minimum).
commit_window_base_s = 5.0
commit_window_per_shot_s = 1.0

[output]
# 保存先のルートディレクトリ
root = "~/Pictures/Tether"

# ファイル命名テンプレ
# 使える変数: {session} {item} {shot:04d} {date} {time}
filename_template = "{session}_{item}_{shot:04d}.dng"

# セッション名のテンプレ (--session フラグで上書き可能)
session_template = "{date}_{name}"

# デフォルトのアイテム名 (--item フラグで上書き)
default_item = "untitled"

# ショット番号の自動採番
auto_increment_shot = true

# 既存ファイルがあった場合の動作: "skip" | "overwrite" | "rename"
on_conflict = "rename"

[lightroom]
# "watch":   Auto Import 監視フォルダ方式 (推奨)
# "session": セッションフォルダ直書き方式 (LR側で手動Sync)
mode = "watch"

# Mode A: Lightroom Auto Import の Watched Folder
# このフォルダは Lightroom 側でも同じパスに設定すること
watch_folder = "~/Pictures/Tether/_watch"

# Mode B: セッションフォルダのルート (output.root と統一推奨)
session_root = "~/Pictures/Tether"

# atomic rename を行う (推奨)
# 一時拡張子で書き込み → 完了後に正式拡張子へ rename
# Lightroom が partial file を取り込むのを防ぐ
use_atomic_write = true

[ui]
# "cli" のみ / "menubar" のみ / "both"
mode = "both"

# 撮影音を鳴らす
play_sound = true
sound_file = ""  # 空ならシステムデフォルト

# キーボードショートカット (CLI モード)
enable_hotkeys = true
hotkey_snap = "space"
hotkey_quit = "q"
hotkey_change_item = "i"

[logging]
# ログレベル: "DEBUG" | "INFO" | "WARNING" | "ERROR"
level = "INFO"

# ログ保存先 (~/Library/Logs/fp-l-tether/ がデフォルト)
log_dir = "~/Library/Logs/fp-l-tether"

# 構造化JSONログも残す (events.jsonl)
emit_jsonl = true

[debug]
# PTPトレースをファイルに保存 (Phase 0 デバッグ用)
save_ptp_trace = false
trace_dir = "~/Library/Logs/fp-l-tether/traces"

# 起動時に GetCamDataGroup1-5 を保存し、撮影中に変化したら警告
detect_setting_reset = true
