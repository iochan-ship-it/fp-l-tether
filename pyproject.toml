[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-l-tether"
version = "0.1.0"
description = "Unofficial Sigma fp L tethered-shooting bridge for macOS + Lightroom Classic"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "iochan-kaihatsu" }]
license = { text = "MIT" }
keywords = ["sigma", "fp-l", "tether", "lightroom", "ptp", "camera", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture",
]

dependencies = [
    # macOS native camera bridge (kept for device enumeration only)
    "pyobjc-core>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ImageCaptureCore>=10.0",

    # USB-level PTP bridge (primary path)
    "pyusb>=1.2",
    "libusb-package>=1.0.26",  # bundles libusb binaries, no Homebrew needed

    # CLI & UI
    "typer>=0.12",
    "rumps>=0.4.0",

    # Configuration & validation
    "pydantic>=2.5",
    "tomli>=2.0; python_version < '3.11'",

    # Filesystem / atomic IO
    "watchdog>=4.0",

    # Logging
    "structlog>=24.1",

    # Optional: keyboard shortcuts in CLI mode
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
fp-l-tether = "fp_l_tether.ui.cli:app"

[tool.setuptools.packages.find]
include = ["fp_l_tether*"]
exclude = ["tests*", "scripts*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "rumps.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pynput.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-v --tb=short"
markers = [
    "integration: requires Sigma fp L hardware",
    "slow: takes more than 5 seconds",
]
